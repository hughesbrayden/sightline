<title>Sightline Demo</title>
<meta name="description" content="Click-through demo of Sightline: a frozen model, a harness that evolves how it reads hurricane reports.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
:root { color-scheme: light; }
/* Sightline tokens as CSS variables, compiled from tokens.json. */
:root {
  --surface: #f4f5f3;
  --surface-raised: #ffffff;
  --surface-sunken: #e9ece9;
  --line: #d8dcd9;
  --line-strong: #848d89;
  --ink: #15191b;
  --ink-muted: #59626a;
  --accent: #0a6c86;
  --accent-soft: #ddeff3;
  --on-accent: #ffffff;
  --good: #1d7544;
  --good-soft: #ddf1e4;
  --warn: #8a5900;
  --warn-soft: #f7ecd6;
  --critical: #b0271f;
  --critical-soft: #f8e1de;
  --series-train: var(--accent);
  --series-heldout: #a44a14;
  --series-baseline: var(--ink-muted);
  --px-void: #1b1c20;
  --px-paper: #f2efe8;
  --px-red: #d63a32;
  --px-orange: #f5a13a;
  --px-yellow: #f3cd3b;
  --px-green: #3d9a44;
  --px-blue: #2350c8;
  --px-brown: #5e3a22;
  --dmg-intact: #e6e9e4;
  --dmg-minor: #efd88f;
  --dmg-street: #9fc4e6;
  --dmg-home: #2c67b0;
  --dmg-wind: #ea9a4c;
  --dmg-major: #c6422a;
  --dmg-destroyed: #551a0f;
  --map-water: #d3dee4;
  --map-park: #dbe5d3;
  --map-glyph: #15191b;
  --map-fire: #ffd166;
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-4: 16px;
  --space-6: 24px;
  --cell: 12px;
  --radius-cell: 0;
  --radius-sm: 2px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --conf-floor: 0.15;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* Sightline components. Tokens come from tokens.css; fonts from Google Fonts (see README). */
body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--ink); }

.sl-stage { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; padding: var(--space-4); }
.sl-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sl-muted { color: var(--ink-muted); }
.sl-small { font-size: 13px; line-height: 18px; }
.sl-up { color: var(--good); }
.sl-down { color: var(--critical); }
.sl-label {
  font-family: var(--font-sans); font-size: 11px; line-height: 16px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);
}

/* PuzzleGrid */
.sl-puzzle { margin: 0; display: inline-flex; flex-direction: column; gap: var(--space-2); }
.sl-grid { display: grid; width: max-content; background: var(--surface-sunken); border: 1px solid var(--line); }
.sl-cell { border-radius: var(--radius-cell); }
.sl-cell-wrong { box-shadow: inset 0 0 0 1px var(--ink), inset 0 0 0 2px var(--surface-raised); }
.sl-puzzle-cap { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); font-size: 13px; line-height: 18px; }

/* StatusBadge */
.sl-badge {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 var(--space-2);
  border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 12px; font-weight: 600;
  line-height: 1; white-space: nowrap; background: var(--surface-sunken); color: var(--ink-muted);
}
.sl-badge::before { content: ""; width: 6px; height: 6px; background: currentColor; flex: none; }
.sl-badge-passed { background: var(--good-soft); color: var(--good); }
.sl-badge-rejected { background: var(--critical-soft); color: var(--critical); }
.sl-badge-denied { background: var(--critical-soft); color: var(--critical); }
.sl-badge-denied::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; width: 8px; height: 8px; }
.sl-badge-running { background: var(--accent-soft); color: var(--accent); }
.sl-badge-skipped::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }

/* LineageNode */
.sl-node {
  display: inline-grid; grid-template-columns: 1fr auto; column-gap: var(--space-2); row-gap: 2px;
  align-items: baseline; min-width: 112px; padding: var(--space-2) 12px; box-sizing: border-box;
  border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-raised);
  color: var(--ink); font: inherit; text-align: left;
}
button.sl-node { cursor: pointer; }
button.sl-node:hover { border-color: var(--line-strong); }
.sl-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sl-node-score { font-size: 18px; line-height: 24px; }
.sl-node-delta { font-size: 13px; line-height: 18px; justify-self: end; }
.sl-node-mark { width: 8px; height: 8px; justify-self: end; align-self: center; }
.sl-mark-accepted { background: var(--good); }
.sl-mark-rejected { background: transparent; box-shadow: inset 0 0 0 1.5px var(--critical); }
.sl-mark-pending { background: var(--accent); }
.sl-mark-skipped { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-muted); }
.sl-node-rejected, .sl-node-skipped { border-style: dashed; border-color: var(--line-strong); background: var(--surface); }
.sl-node-rejected .sl-node-score, .sl-node-skipped .sl-node-score { color: var(--ink-muted); }
.sl-node-pending { border-color: var(--accent); }
.sl-node-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* ScoreCurve */
.sl-curve { margin: 0; display: inline-flex; flex-direction: column; gap: var(--space-2); max-width: 100%; }
.sl-curve-svg { display: block; max-width: 100%; height: auto; }
.sl-curve-svg text { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-muted); }
.sl-curve-grid { stroke: var(--line); stroke-width: 1; }
.sl-base { stroke: var(--series-baseline); stroke-width: 1.5; stroke-dasharray: 4 4; }
.sl-line-train, .sl-line-heldout { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.sl-line-train { stroke: var(--series-train); }
.sl-line-heldout { stroke: var(--series-heldout); }
.sl-dot-train { fill: var(--series-train); }
.sl-dot-heldout { fill: var(--series-heldout); }
.sl-curve-svg .sl-end-train { fill: var(--series-train); font-weight: 600; }
.sl-curve-svg .sl-end-heldout { fill: var(--series-heldout); font-weight: 600; }
.sl-legend { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.sl-key { display: inline-flex; align-items: center; gap: 6px; }
.sl-key::before { content: ""; width: 14px; height: 0; border-top: 2px solid currentColor; }
.sl-key-train::before { border-color: var(--series-train); }
.sl-key-heldout::before { border-color: var(--series-heldout); }
.sl-key-base::before { border-top: 2px dashed var(--series-baseline); }

/* DiffCard */
.sl-diff {
  display: grid; gap: 12px; max-width: 460px; box-sizing: border-box; padding: var(--space-4);
  border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-raised); color: var(--ink);
}
.sl-diff-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
.sl-diff-title { font-size: 15px; line-height: 22px; font-weight: 600; }
.sl-diff-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.sl-diff-row { display: grid; grid-template-columns: 84px 14px 1fr; gap: var(--space-2); align-items: baseline; }
.sl-diff-text { font-size: 14px; line-height: 20px; }
.sl-op { font-size: 14px; font-weight: 600; text-align: center; }
.sl-op-add { color: var(--good); }
.sl-op-remove { color: var(--critical); }
.sl-op-change { color: var(--accent); }
.sl-diff-foot { display: flex; flex-wrap: wrap; gap: var(--space-4); padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
.sl-diff-foot > span { display: inline-flex; align-items: baseline; gap: 6px; }

@media (prefers-reduced-motion: no-preference) {
  .sl-cell { transition: opacity 240ms ease-out, background-color 240ms ease-out; }
}

/* ScoreCurve reference lines */
.sl-ref { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 2 4; }
.sl-curve-svg .sl-ref-label { fill: var(--ink-muted); font-size: 10px; }

/* DamageMap */
.sl-map { display: grid; width: max-content; background: var(--map-water); padding: 1px; }
.sl-map-pick { cursor: crosshair; }
.sl-mcell { position: relative; }
.sl-mcell-wrong { box-shadow: inset 0 0 0 1px var(--ink), inset 0 0 0 2px var(--surface-raised); }
.sl-mcell-sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 1; }
.sl-glyph { position: absolute; inset: 22%; display: block; }
.sl-glyph-hospital {
  background: linear-gradient(var(--map-glyph), var(--map-glyph)) center / 100% 30% no-repeat,
              linear-gradient(var(--map-glyph), var(--map-glyph)) center / 30% 100% no-repeat;
}
.sl-glyph-shelter { background: var(--map-glyph); clip-path: polygon(50% 4%, 96% 94%, 4% 94%); }
.sl-glyph-road {
  background: linear-gradient(45deg, transparent 40%, var(--map-glyph) 40% 60%, transparent 60%),
              linear-gradient(-45deg, transparent 40%, var(--map-glyph) 40% 60%, transparent 60%);
}
.sl-glyph-power { background: var(--map-glyph); clip-path: polygon(58% 0, 18% 56%, 46% 56%, 36% 100%, 82% 40%, 54% 40%, 70% 0); }
.sl-glyph-fire { inset: 28%; border-radius: 50%; background: var(--map-fire); }

/* DamageLegend */
.sl-legend-map { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; font-size: 12px; line-height: 16px; color: var(--ink); }
.sl-legend-one { grid-template-columns: minmax(0, 1fr); }
.sl-legend-map li { display: flex; align-items: center; gap: 8px; }
.sl-swatch { position: relative; width: 14px; height: 14px; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06); }
.sl-crit { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--critical); }

/* LineageTree */
.sl-lt { display: block; max-width: 100%; height: auto; overflow: visible; }
.sl-lt-edge { stroke: var(--accent); stroke-width: 2; }
.sl-lt-branch { fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; }
.sl-lt-branch-rejected { stroke: var(--critical); }
.sl-lt-branch-skipped { stroke: var(--line-strong); }
.sl-lt-node circle { stroke-width: 2; }
.sl-lt-baseline circle { fill: var(--ink); stroke: var(--ink); }
.sl-lt-kept circle { fill: var(--accent); stroke: var(--accent); }
.sl-lt-rejected circle { fill: var(--surface-raised); stroke: var(--critical); stroke-dasharray: 3 3; }
.sl-lt-skipped circle { fill: var(--surface-raised); stroke: var(--line-strong); }
.sl-lt .sl-lt-num { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.sl-lt-baseline .sl-lt-num, .sl-lt-kept .sl-lt-num { fill: var(--surface-raised); }
.sl-lt-rejected .sl-lt-num { fill: var(--critical); }
.sl-lt-skipped .sl-lt-num { fill: var(--ink-muted); }
.sl-lt .sl-lt-label { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-muted); }
.sl-lt-kept .sl-lt-label { fill: var(--ink); }
.sl-lt-rejected .sl-lt-label { fill: var(--critical); }
.sl-lt-current circle { fill: var(--surface-raised); stroke: var(--series-heldout); stroke-width: 2; stroke-dasharray: 4 3; }
.sl-lt-current .sl-lt-num { fill: var(--series-heldout); font-family: var(--font-mono); font-size: 11px; }
@media (prefers-reduced-motion: no-preference) {
  .sl-lt-current circle { animation: sl-lt-spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes sl-lt-spin { to { transform: rotate(360deg); } }
}

/* PolicyRules */
.sl-rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.sl-rules li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); }
.sl-rules-n { color: var(--ink-muted); font-size: 14px; }
.sl-rules-text { font-size: 19px; line-height: 26px; color: var(--ink); }
.sl-rules-gen { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: var(--radius-sm); white-space: nowrap; }
/* Page shell: a fixed 1440×964 stage scaled to fit any window. Light only, by design. */
html, body { height: 100%; }
body { margin: 0; background: #dfe3df; color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
#frame { height: 100%; display: flex; align-items: center; justify-content: center; }
#wrap { position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,0.04); }
#stage { position: absolute; left: 0; top: 0; width: 1440px; height: 964px; transform-origin: 0 0; background: var(--surface-raised); }

.app { width: 1440px; height: 964px; display: flex; flex-direction: column; }
.screen { width: 1440px; height: 900px; box-sizing: border-box; padding: 28px 48px 28px; display: flex; flex-direction: column; gap: 24px; background: var(--surface-raised); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 14px; }
.wordmark { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-stretch: 87.5%; letter-spacing: -0.01em; }
.body { flex-grow: 1; min-height: 0; display: flex; gap: 56px; }
.panel { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.panel-foot { margin-top: auto; display: flex; flex-direction: column; gap: 18px; }

.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.between { justify-content: space-between; }
.end { align-items: flex-end; }
.grow { flex-grow: 1; min-width: 0; }
.gap2 { gap: 2px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; } .gap40 { gap: 40px; }
.push { margin-left: auto; }
.push-bottom { margin-top: auto; }
.right { text-align: right; }
.pad8 { padding-bottom: 8px; }

.muted { color: var(--ink-muted); }
.small { font-size: 13px; line-height: 19px; }
.xs { font-size: 12px; line-height: 17px; }
.tiny { font-size: 11px; line-height: 15px; }
.strong { font-weight: 600; }
.normal { font-weight: 400; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.h3 { font-size: 22px; line-height: 28px; }

.intro { display: flex; flex-direction: column; gap: 8px; }
.intro h2 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0; font-size: 15px; line-height: 23px; max-width: 560px; }

.stats { display: flex; gap: 40px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { display: flex; flex-direction: column; gap: 4px; }
.num { font-weight: 300; letter-spacing: -0.02em; }
.num.md { font-size: 26px; line-height: 30px; }
.num.xl { font-size: 42px; line-height: 46px; }
.num.xxl { font-size: 60px; line-height: 62px; letter-spacing: -0.03em; }
.unit { font-size: 18px; color: var(--ink-muted); letter-spacing: 0; }

.pill { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.pill-dot { width: 7px; height: 7px; background: currentColor; }
.pill-live { background: var(--accent-soft); color: var(--accent); }
.pill-review { background: var(--surface-sunken); color: var(--ink); }
.pill-training { background: var(--warn-soft); color: var(--series-heldout); }
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.tag-live { color: var(--accent); }
.tag-train { color: var(--series-heldout); }

.mapstage { position: relative; width: 675px; flex: none; }
.pin { position: absolute; pointer-events: none; }
.mark { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--surface-raised); font-family: var(--font-mono); font-size: 12px; box-shadow: 0 0 0 2px var(--surface-raised); pointer-events: none; }
.mark-good, .mark.good { background: var(--good); }
.mark.static { position: static; transform: none; flex: none; box-shadow: none; }
.hint { position: absolute; left: 0; bottom: 0; font-size: 12px; color: var(--ink-muted); background: var(--surface-raised); padding: 2px 0; }
.blockcard { position: absolute; left: 16px; bottom: 44px; width: 360px; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px; z-index: 3; }
.blockcard .x { margin-left: 8px; width: 26px; height: 26px; border: 0; border-radius: 13px; background: var(--surface-sunken); color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer; }
.reports { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.reports li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; font-size: 12px; line-height: 17px; }

.counts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.feed { display: flex; flex-direction: column; }
.feedrow { display: grid; grid-template-columns: 44px 56px minmax(0, 1fr) 70px; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 18px; animation: rise 300ms ease-out; }
.flag { font-size: 11px; font-weight: 600; color: var(--warn); text-align: right; }
.trow { display: grid; grid-template-columns: 22px 60px minmax(0, 1fr) 130px 44px; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; animation: rise 300ms ease-out; }
.misread { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; }
.compare { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 120px; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.crow.head { font-size: 12px; color: var(--ink-muted); padding: 10px 0; }
.crow.head span { text-align: right; }
.crow .before { font-size: 22px; font-weight: 300; text-align: right; color: var(--ink-muted); }
.crow .after { font-size: 22px; text-align: right; color: var(--good); }
.ruled { padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.barrow { display: grid; grid-template-columns: 104px minmax(0, 1fr) 44px; gap: 12px; align-items: center; font-size: 13px; }
.track { height: 8px; background: var(--surface-sunken); }
.track div { height: 8px; background: var(--series-train); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; line-height: 17px; color: var(--ink-muted); }

.tonight { width: 330px; flex: none; align-self: flex-start; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-sunken); border-radius: 10px; }
.logrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 120px; gap: 10px; align-items: baseline; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.logrow.current { background: var(--warn-soft); }
.logrow > span:last-child { text-align: right; }

.veil { position: absolute; left: 0; top: 0; width: 675px; height: 675px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.72); }
.startcard { width: 380px; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; gap: 14px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 10px; }
.itercard { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--surface-sunken); border-radius: 10px; font-size: 14px; line-height: 21px; }
.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.phase { display: flex; flex-direction: column; gap: 5px; }
.ptrack { height: 4px; background: var(--line); }
.ptrack div { height: 4px; transition: width 180ms linear; }

button { font: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cta { align-self: flex-start; height: 44px; padding: 0 20px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600; cursor: pointer; }
.cta:hover { filter: brightness(1.08); }
.cta.wide { align-self: stretch; }

    });

    var heldTown = cities[1];

      <div className="tonight">
        <span className="tag tag-live"><span className="pill-dot"></span>Tonight · live</span>
        <${S.DamageMap} cells=${F.zero.cells} confidence=${F.zero.conf} cellSize=${9} label="Tonight's generation 0 map" />
        <span className="small">Generation 0 scored <span className="mono">${pct(F.zero.acc)}</span>. It waits here for the evolved harness.</span>
      </div>
      <div className="col gap10">
        <div className="row between"><span className="tag tag-train"><span className="pill-dot"></span>Evolution · Storm 1, October · assessed</span><span className="mono small">Generation ${runs[cur].run - 1} of 7</span></div>
        <${S.DamageMap} cells=${runs[shown].cells} confidence=${runs[shown].conf} cellSize=${15} label="Past storm map at the current generation" />
        <div className="row between"><span className="muted small">Fitness: scored against Storm 1's official assessment</span><span className="mono num md" style=${{ color: 'var(--series-heldout)' }}>${pct(runs[shown].acc)}</span></div>
      </div>
      <div className="col gap12 grow">
        <strong className="small">Generations: what the harness is trying</strong>
        <div className="col">${runs.map(function (r, i) {
          var done = i <= cur;
          var result = !done ? 'queued' : r.status === 'accepted' ? (r.run === 1 ? 'generation 0' : 'kept') : r.status === 'rejected' ? 'rejected by the gate' : 'skipped by memory';
          var color = !done ? 'var(--ink-muted)' : r.status === 'accepted' ? 'var(--good)' : r.status === 'rejected' ? 'var(--critical)' : 'var(--ink-muted)';
          return html`<div className=${'logrow' + (i === cur ? ' current' : '')} style=${{ opacity: done ? 1 : 0.45 }} key=${i}><span className="mono muted xs">Gen ${r.run - 1}</span><span className="xs">${r.hyp}</span><span className="xs strong" style=${{ color: color }}>${result}</span></div>`;
        })}</div>
        ${props.next}
        <${S.ScoreCurve} train=${curve} xLabels=${runs.map(function (r) { return 'Gen ' + (r.run - 1); })} trainLabel="Lineage so far on Storm 1" min=${0.2} max=${1} width=${420} height=${150} label="Score by generation" />
      </div>
    </div>`;
  }

  // ---------- live arena ----------
  var PLAN_NORMAL = [['Propose', 2], ['Compile', 0.8], ['Backtest', 4], ['Score', 0.8], ['Verdict', 1.4]];
  var PLAN_SKIP = [['Propose', 2], ['Memory check', 1.4], ['Verdict', 1.4]];

  function Arena(props) {
    var init = { started: false, done: false, iter: 0, phase: 0, pt: 0, elapsed: 0, history: [], best: null };
    var s = useState(init), st = s[0], setSt = s[1];
    var runs = F.runs;
    useEffect(function () {
      if (!st.started || st.done) return;
      var id = setInterval(function () {
        setSt(function (prev) {
          if (!prev.started || prev.done) return prev;
          var run = runs[prev.iter], plan = run.status === 'skipped' ? PLAN_SKIP : PLAN_NORMAL;
          var next = Object.assign({}, prev, { elapsed: prev.elapsed + 0.2, pt: prev.pt + 0.2 });
          if (next.pt >= plan[prev.phase][1]) {
            next.pt = 0; next.phase = prev.phase + 1;
            if (next.phase >= plan.length) {
              var bestAcc = prev.best == null ? null : runs[prev.best].acc;
              var kept = run.status === 'accepted' && (bestAcc == null || run.acc > bestAcc);
              next.history = prev.history.concat([{ run: run.run, status: run.status, acc: run.acc, bestBefore: bestAcc, kept: kept }]);
              next.best = kept ? prev.iter : prev.best;
              next.iter = prev.iter + 1; next.phase = 0;
              if (next.iter >= runs.length) { next.done = true; next.iter = runs.length - 1; }
            }
          }
          return next;
        });
      }, 200);
      return function () { clearInterval(id); };
    }, [st.started, st.done]);
    useEffect(function () { if (props.onStatus) props.onStatus(st.started ? (st.done ? 'done' : 'running') : 'idle'); }, [st.started, st.done]);

    var run = runs[st.iter], plan = run.status === 'skipped' ? PLAN_SKIP : PLAN_NORMAL;
    var bestRun = st.best == null ? null : runs[st.best];
    var base = bestRun ? bestRun.cells : F.calm, baseConf = bestRun ? bestRun.conf : null;
    var cells = base, conf = baseConf, caption = bestRun ? 'Lineage so far · generation ' + (bestRun.run - 1) : 'Waiting to start', meta = bestRun ? pct(bestRun.acc) + ' right' : '';
    var phaseName = st.started && !st.done ? plan[st.phase][0] : '';
    var mapped = 0;
    if (phaseName === 'Backtest' && run.cells) {
      mapped = Math.floor((st.pt / plan[st.phase][1]) * 1024);
      cells = run.cells.map(function (c, i) { return i < mapped ? c : base[i]; });
      conf = run.cells.map(function (c, i) { return i < mapped ? run.conf[i] : (baseConf ? baseConf[i] : 1); });
      caption = 'Generation ' + (run.run - 1) + ' · backtest'; meta = mapped.toLocaleString('en-US') + ' of 1,024 blocks';
    } else if ((phaseName === 'Score' || phaseName === 'Verdict') && run.cells) {
      cells = run.cells; conf = run.conf; caption = 'Generation ' + (run.run - 1) + ' · candidate'; meta = phaseName === 'Score' ? 'scoring' : pct(run.acc) + ' right';
    }
    var bestAcc = bestRun ? bestRun.acc : null, startAcc = st.history.length ? st.history[0].acc : null;
    var src = D.RUNS_NYC[st.iter];
    var improves = run.run === 1 || (bestAcc != null && run.acc > bestAcc);
    var status = !st.started ? '' : st.done ? 'Finished. ' + pct(bestAcc) + ' right, up from ' + pct(startAcc) + ' at generation 0.' : {
      Propose: 'Reading the last generation’s mistakes and writing one change…',
      Compile: 'Compiling the policy into a MongoDB aggregation pipeline…',
      Backtest: 'Backtest: Jev is mapping ' + mapped.toLocaleString('en-US') + ' of 1,024 blocks…',
      Score: 'Scoring against the official assessment (scorer login only)…',
      'Memory check': 'Checking memory for similar failed ideas…',
      Verdict: run.status === 'skipped' ? 'Skipped by memory: too close to generation 2, which failed. Not scored.' : run.run === 1 ? 'Generation 0 set: ' + pct(run.acc) + ' right.' : improves ? 'Kept: ' + sgn(run.acc - bestAcc) + ' points. It joins the lineage.' : 'Rejected by the gate: ' + sgn(run.acc - (bestAcc || 0)) + ' points. The lineage stays as it was.'
    }[phaseName];
    var statusColor = st.done ? 'var(--good)' : phaseName !== 'Verdict' || run.status === 'skipped' ? 'var(--ink-muted)' : improves ? 'var(--good)' : 'var(--critical)';

    var curveBest = [], tries = [], running = null;
    runs.forEach(function (r, i) {
      var h = st.history[i];
      if (!h) { curveBest.push(null); tries.push(null); return; }
      if (h.kept) running = h.acc;
      curveBest.push(running); tries.push(h.status === 'skipped' ? null : h.acc);
    });
    var secs = Math.floor(st.elapsed * 3.2);
    var clock = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');

    return html`<div className="screen">
      <${Header} place="New York · Storm 1, October · official assessment on file, locked to the scorer" clock=${'Generation ' + (st.started ? run.run - 1 : 0) + ' of 7 · elapsed ' + clock} mode="training"
        modeLabel=${!st.started ? 'Evolution ready' : st.done ? 'Evolution done' : 'Evolution live'}
        right=${st.started ? html`<button className="ghost" onClick=${function () { setSt(init); }}>Reset</button>` : null} />
      <div className="body">
        <div className="mapstage">
          <${S.DamageMap} cells=${cells} confidence=${conf} cellSize=${CELL} caption=${caption} meta=${meta} label="Storm 1 map at the current generation" />
          ${!st.started ? html`<div className="veil"><div className="startcard">
            <span className="tag tag-train">Live evolution</span>
            <strong className="h3">Give the harness a past storm to evolve on</strong>
            <span className="muted small">1,024 blocks, 9,812 reports, and the official assessment it's scored against. 7 generations after generation 0, about 30 seconds each.</span>
            <button className="cta wide" onClick=${function () { setSt(Object.assign({}, init, { started: true })); }}>Start evolution</button>
          </div></div>` : null}
        </div>
        <div className="panel">
          <div className="row gap40 end"><${Stat} label="Blocks right, lineage so far" value=${pct(bestAcc)} size="xxl" color="var(--series-heldout)" /><${Stat} label="Since generation 0" value=${bestAcc != null && startAcc != null ? sgn(bestAcc - startAcc) + ' pts' : '—'} size="md" color="var(--good)" /></div>
          <div className="itercard">
            <div className="row between"><strong>${!st.started ? 'Ready' : st.done ? 'All 7 generations done' : 'Generation ' + (run.run - 1)}</strong><span className="muted xs">${st.started && !st.done && src.predicted != null ? 'Predicts +' + (src.predicted * 100).toFixed(0) + ' points' : ''}</span></div>
            <span>${!st.started ? 'Press Start evolution. Each generation proposes one change, compiles it to a MongoDB pipeline, has Jev backtest every block, scores the map against the locked assessment, and joins the lineage only if the score rises.' : st.done ? 'The evolved harness is saved to the lineage and is what runs on the next live storm.' : src.hyp}</span>
            <div className="phases">${['Propose', 'Compile', 'Backtest', 'Score', 'Verdict'].map(function (name) {
              var names = plan.map(function (p) { return p[0]; });
              var idx = names.indexOf(name);
              if (name === 'Compile' && idx < 0) idx = names.indexOf('Memory check');
              var label = idx < 0 ? name + ' (skipped)' : (name === 'Compile' && run.status === 'skipped' ? 'Memory check' : name);
              var fill = 0, color = 'var(--accent)', on = false;
              if (st.done) { fill = 100; color = 'var(--line-strong)'; }
              else if (st.started && idx >= 0) {
                if (idx < st.phase) { fill = 100; color = 'var(--good)'; on = true; }
                else if (idx === st.phase) { fill = Math.round((st.pt / plan[idx][1]) * 100); on = true; }
              }
              return html`<div className="phase" key=${name}><div className="ptrack"><div style=${{ width: fill + '%', background: color }}></div></div><span className=${'xs' + (on ? '' : ' muted')}>${label}</span></div>`;
            })}</div>
            <span className="mono xs" style=${{ color: statusColor }}>${status}</span>
          </div>
          <${S.ScoreCurve} train=${curveBest} heldout=${tries} xLabels=${runs.map(function (r) { return 'Gen ' + (r.run - 1); })} trainLabel="Lineage so far" heldoutLabel="Each generation" min=${0.2} max=${1} width=${613} height=${170} label="Score by generation" />
          <div className="col">${st.history.slice().reverse().slice(0, 3).map(function (h) {
            var result = h.status === 'skipped' ? 'skipped by memory' : h.run === 1 ? 'generation 0 · ' + pct(h.acc) : h.kept ? 'kept ' + sgn(h.acc - h.bestBefore) : 'rejected ' + sgn(h.acc - h.bestBefore);
            return html`<div className="logrow" key=${h.run}><span className="mono muted xs">Gen ${h.run - 1}</span><span className="xs">${D.RUNS_NYC[h.run - 1].hyp}</span><span className="xs strong" style=${{ color: h.status === 'skipped' ? 'var(--ink-muted)' : h.kept ? 'var(--good)' : 'var(--critical)' }}>${result}</span></div>`;
          })}</div>
          <span className="muted tiny push-bottom">Plays about 3× faster than the real loop. Example data: stylized map and made-up scores.</span>
        </div>
      </div>
    </div>`;
  }

  // ---------- shell ----------
  var NAMES = ['Calm night', 'Storm hits', 'Generation 0', 'Fitness signal', 'Evolution', 'Replay', 'Any city'];

  function App() {
    var s1 = useState(1), step = s1[0], setStep = s1[1];
    var s2 = useState('story'), view = s2[0], setView = s2[1];
    var s3 = useState('idle'), arena = s3[0], setArena = s3[1];
    var go = function (n) { setView('story'); setStep(Math.max(1, Math.min(7, n))); };
    var stepRef = useRef(step); stepRef.current = step;
    useEffect(function () {
      function onKey(e) {
        if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
        if (e.key === 'ArrowRight') go(stepRef.current + 1);
        if (e.key === 'ArrowLeft') go(stepRef.current - 1);
      }
      window.addEventListener('keydown', onKey);
      return function () { window.removeEventListener('keydown', onKey); };
    }, []);
    var story = view === 'story';
    return html`<div className="app">
      <div style=${{ display: story ? 'block' : 'none' }}><${Story} step=${step} onNext=${function () { go(step + 1); }} /></div>
      <div style=${{ display: story ? 'none' : 'block' }}><${Arena} onStatus=${setArena} /></div>
      <nav className="presenter" aria-label="Presenter controls">
        <div className="seg" role="group" aria-label="View">
          <button className=${story ? 'on' : ''} aria-pressed=${story} onClick=${function () { setView('story'); }}>Story</button>
          <button className=${!story ? 'on' : ''} aria-pressed=${!story} onClick=${function () { setView('arena'); }}>Live arena${arena === 'running' ? html` <span className="live-dot"></span>` : arena === 'done' ? ' ✓' : ''}</button>
        </div>
        <div className="steps" style=${{ opacity: story ? 1 : 0.5 }}>${NAMES.map(function (name, i) {
          var n = i + 1, on = story && n === step;
          return html`<button key=${n} className=${'step' + (on ? ' on' : '')} aria-label=${'Step ' + n + ': ' + name} aria-current=${on ? 'step' : 'false'} onClick=${function () { go(n); }}>${on ? n + ' · ' + name : n}</button>`;
        })}</div>
        <div className="row gap8">
          <span className="muted xs">← → keys</span>
          <button className="ghost" disabled=${story && step === 1} onClick=${function () { go(step - 1); }}>Back</button>
          <button className="dark" disabled=${story && step === 7} onClick=${function () { go(step + 1); }}>Next</button>
        </div>
      </nav>
    </div>`;
  }

  // ---------- fit the 1440×964 stage to the window ----------
  function fit() {
    var stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
    var k = Math.min(window.innerWidth / 1440, window.innerHeight / 964);
    stage.style.transform = 'scale(' + k + ')';
    wrap.style.width = Math.floor(1440 * k) + 'px';
    wrap.style.height = Math.floor(964 * k) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  ReactDOM.createRoot(document.getElementById('stage')).render(html`<${App} />`);
})();
</script>
