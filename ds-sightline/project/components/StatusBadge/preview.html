<html>
<head>

<body>
<div id="root" class="sl-stage" style="align-items:center"></div>
<script>
  var S = window.Sightline, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h(S.StatusBadge, { kind: "passed" }),
    h(S.StatusBadge, { kind: "rejected" }),
    h(S.StatusBadge, { kind: "skipped" }),
    h(S.StatusBadge, { kind: "denied" }),
    h(S.StatusBadge, { kind: "running" }, "Scoring 7/12")
  ));
</script>
