<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .deep { fill: var(--ink); }
  .brand { fill: var(--accent); }
  .tint { fill: var(--accent-soft); }
  .held { fill: var(--series-heldout); }
  .panel { rx: var(--radius-lg); }
  .chip { rx: var(--radius-sm); }
  .cellu { rx: var(--radius-cell); }
  .cellu.hit { fill: var(--accent); }
  .cellu.bg { fill: var(--surface); }
  .cellu.faint { opacity: var(--conf-floor); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 80px; line-height: .92; font-weight: 600; font-stretch: 87.5%; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 304x226 bled off the top and right (the instrument body, largest) · accent 168x128 (signal teal, the identity hue) · accent-soft 120x96 (relief tint) · series-heldout 96x32 once (it only ever means held-out) · about 40% of 960x288
  arrangement one tall ink slab with satellites on the left, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     literal motif, from "confidence is opacity" and "pixels are square": a 8x6 heart in square cells at a space-6 pitch on the slab, left half at conf-floor opacity and right half solid, so the picture is half-resolved
  scales      cells space-4 square at space-6 pitch, radius-cell 0; gutters space-4; panels radius-lg, the held-out chip radius-sm
-->
